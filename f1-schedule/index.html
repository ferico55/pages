<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>F1 Schedule</title>
<style>
  :root {
    --bg: #0d0f14;
    --surface: #161921;
    --border: #232733;
    --accent: #6ee7b7;
    --accent2: #60a5fa;
    --text: #e8eaf0;
    --muted: #6b7280;
    --rb-navy: #1E5BC6;
    --rb-red: #DC0000;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, sans-serif;
    padding: 24px 20px 48px;
  }

  .wrap { max-width: 1600px; margin: 0 auto; }

  header { margin-bottom: 20px; }

  .back { display: inline-block; font-size: 12px; color: var(--muted); text-decoration: none; margin-bottom: 10px; }
  .back:hover { color: var(--accent); }

  h1 {
    font-size: 24px;
    font-weight: 700;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 6px;
  }

  .subtitle { color: var(--muted); font-size: 13px; }
  .updated { color: var(--muted); font-size: 11px; margin-top: 6px; }

  h2.sec-title {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--muted);
    padding-bottom: 8px;
    margin-bottom: 10px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: baseline;
    justify-content: space-between;
  }

  h3.sub-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    margin: 14px 0 8px;
  }
  h3.sub-title:first-child { margin-top: 0; }

  /* Hero */
  .hero-grid { display: grid; grid-template-columns: 1fr; gap: 12px; margin-bottom: 20px; max-width: 420px; }
  .hero-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
  }
  .hero-label { font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
  .hero-main { font-size: 15px; font-weight: 600; margin-bottom: 4px; line-height: 1.4; }
  .hero-sub { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
  .hero-countdown { font-size: 13px; font-weight: 700; color: var(--accent); }
  .hero-empty { font-size: 13px; color: var(--muted); }

  /* Dashboard: horizontal columns on desktop, stacked on mobile */
  .dashboard { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; align-items: start; }
  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 16px;
    min-width: 0;
  }
  .panel-body { max-height: 68vh; overflow-y: auto; padding-right: 2px; }

  .count-tag { font-weight: 400; color: var(--muted); text-transform: none; letter-spacing: 0; }

  /* Cards / rows */
  .list { display: flex; flex-direction: column; gap: 8px; }

  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 13px;
  }
  .row.favorite { border-color: var(--rb-navy); background: linear-gradient(90deg, rgba(30,91,198,0.25), rgba(220,0,0,0.12) 80%, var(--bg)); }

  .row .matchup { font-weight: 600; }
  .row .meta { color: var(--muted); font-size: 11px; }
  .badge {
    display: inline-block;
    font-size: 9px;
    font-weight: 700;
    padding: 2px 6px;
    border-radius: 99px;
    margin-left: 6px;
    vertical-align: middle;
    background: var(--rb-navy);
    color: #fff;
  }

  /* Standings tables */
  table { width: 100%; border-collapse: collapse; font-size: 12px; margin-bottom: 4px; }
  th { text-align: left; color: var(--muted); font-weight: 600; font-size: 10px; text-transform: uppercase; letter-spacing: .05em; padding: 6px 8px; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--surface); }
  td { padding: 7px 8px; border-bottom: 1px solid var(--border); }
  tr:last-child td { border-bottom: none; }
  tr.favorite td:first-child { border-left: 3px solid var(--rb-navy); }
  .standings-card { background: var(--bg); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; overflow-x: auto; }

  .tab-bar { display: flex; gap: 6px; margin-bottom: 10px; }
  .tab-btn {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 6px 10px;
    border-radius: 8px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .03em;
    cursor: pointer;
  }
  .tab-btn.active { color: var(--text); border-color: var(--rb-navy); }
  .tab-panel.hidden { display: none; }

  .error-msg, .empty-msg { color: var(--muted); font-size: 12px; padding: 14px; text-align: center; }

  footer { margin-top: 24px; font-size: 11px; color: var(--muted); text-align: center; }
  footer a { color: var(--muted); }

  @media (max-width: 1100px) {
    .dashboard { grid-template-columns: 1fr 1fr; }
    .panel.past { grid-column: 1 / -1; }
  }

  @media (max-width: 700px) {
    .hero-grid { max-width: none; }
    .dashboard { grid-template-columns: 1fr; }
    .panel.past { grid-column: auto; }
    .panel-body { max-height: none; overflow: visible; }
    th { position: static; }
  }
</style>
</head>
<body>
<div class="wrap">

<header>
  <a class="back" href="../">← Pages</a>
  <h1>🏎️ F1 Schedule</h1>
  <p class="subtitle">Season schedule &amp; standings · Red Bull highlighted</p>
  <p class="updated" id="updated-line"></p>
</header>

<div class="hero-grid" id="hero-grid"></div>

<div class="dashboard">
  <section class="panel">
    <h2 class="sec-title">Upcoming Races</h2>
    <div class="panel-body list" id="f1-upcoming"></div>
  </section>

  <section class="panel">
    <h2 class="sec-title">Standings</h2>
    <div class="tab-bar">
      <button class="tab-btn active" data-tab="drivers">Drivers</button>
      <button class="tab-btn" data-tab="constructors">Constructors</button>
    </div>
    <div class="panel-body">
      <div class="tab-panel" id="f1-standings-drivers"></div>
      <div class="tab-panel hidden" id="f1-standings-constructors"></div>
    </div>
  </section>

  <section class="panel past">
    <h2 class="sec-title">Past Races <span class="count-tag" id="f1-past-count"></span></h2>
    <div class="panel-body" id="f1-past-list"></div>
  </section>
</div>

<footer>
  Data refreshes nightly via GitHub Actions ·
  <a href="./data/schedule.json">schedule.json</a> ·
  <a href="./data/standings.json">standings.json</a> ·
  <a href="../nfl-schedule/">NFL schedule →</a>
</footer>

</div>

<script>
(function () {
  'use strict';

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function fmtDateTime(iso) {
    var d = new Date(iso);
    if (isNaN(d)) return '';
    return d.toLocaleString(undefined, { weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
  }

  function fmtDateOnly(iso) {
    var d = new Date(iso);
    if (isNaN(d)) return '';
    return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
  }

  function timeUntil(iso) {
    var now = new Date();
    var target = new Date(iso);
    var diff = target - now;
    if (diff <= 0) return 'Underway / starting now';
    var mins = Math.floor(diff / 60000);
    var hours = Math.floor(mins / 60);
    var days = Math.floor(hours / 24);
    hours = hours % 24;
    mins = mins % 60;
    if (days > 0) return 'in ' + days + 'd ' + hours + 'h';
    if (hours > 0) return 'in ' + hours + 'h ' + mins + 'm';
    return 'in ' + mins + 'm';
  }

  function fmtFinish(pos) {
    if (pos == null || pos === '') return '—';
    return /^\d+$/.test(String(pos)) ? 'P' + pos : String(pos);
  }

  // Splits items into upcoming/past based on the CURRENT time at call time,
  // never a pre-computed "status" field, so re-opening the page later
  // always re-buckets against the real current date.
  function bucket(items, dateField) {
    var now = new Date();
    var upcoming = items.filter(function (i) { return i[dateField] && new Date(i[dateField]) >= now; })
      .sort(function (a, b) { return new Date(a[dateField]) - new Date(b[dateField]); });
    var past = items.filter(function (i) { return i[dateField] && new Date(i[dateField]) < now; })
      .sort(function (a, b) { return new Date(b[dateField]) - new Date(a[dateField]); });
    return { upcoming: upcoming, past: past };
  }

  function heroCard(label, main, sub, dateIso) {
    if (!main) {
      return '<div class="hero-card"><div class="hero-label">' + esc(label) + '</div><div class="hero-empty">Nothing scheduled yet — check back once data has been fetched.</div></div>';
    }
    return '<div class="hero-card">' +
      '<div class="hero-label">' + esc(label) + '</div>' +
      '<div class="hero-main">' + main + '</div>' +
      '<div class="hero-sub">' + esc(sub) + '</div>' +
      '<div class="hero-countdown">' + esc(timeUntil(dateIso)) + '</div>' +
      '</div>';
  }

  function renderHero(schedule) {
    var el = document.getElementById('hero-grid');
    var races = (schedule && schedule.races) || [];
    var nextRace = bucket(races, 'race_date_utc').upcoming[0];

    el.innerHTML = nextRace
      ? heroCard('Next Race', esc(nextRace.race_name), esc(nextRace.locality) + ', ' + esc(nextRace.country) + ' · ' + fmtDateTime(nextRace.race_date_utc), nextRace.race_date_utc)
      : heroCard('Next Race', null);
  }

  function renderUpcoming(schedule) {
    var el = document.getElementById('f1-upcoming');
    var races = (schedule && schedule.races) || [];
    var upcoming = bucket(races, 'race_date_utc').upcoming;
    if (upcoming.length === 0) {
      el.innerHTML = '<div class="empty-msg">No upcoming races in the data yet.</div>';
      return;
    }
    var html = '';
    upcoming.forEach(function (r) {
      html += '<div class="row">' +
        '<div><span class="matchup">Round ' + r.round + ' — ' + esc(r.race_name) + '</span>' +
        '<div class="meta">' + esc(r.locality) + ', ' + esc(r.country) + '</div></div>' +
        '<div class="meta">' + fmtDateTime(r.race_date_utc) + '</div>' +
        '</div>';
    });
    el.innerHTML = html;
  }

  function renderPast(schedule) {
    var count = document.getElementById('f1-past-count');
    var el = document.getElementById('f1-past-list');
    var races = (schedule && schedule.races) || [];
    var past = bucket(races, 'race_date_utc').past;
    count.textContent = '(' + past.length + ')';
    if (past.length === 0) {
      el.innerHTML = '<div class="empty-msg">No past races yet.</div>';
      return;
    }
    var html = '<table><thead><tr><th>Date</th><th>Race</th><th>Winner</th><th>VER</th></tr></thead><tbody>';
    past.forEach(function (r) {
      var isRb = r.winner_constructor === 'Red Bull';
      html += '<tr class="' + (isRb ? 'favorite' : '') + '">' +
        '<td>' + fmtDateOnly(r.race_date_utc) + '</td>' +
        '<td>Round ' + r.round + ' — ' + esc(r.race_name) + '</td>' +
        '<td>' + (r.winner ? esc(r.winner) + (isRb ? '<span class="badge">RED BULL</span>' : '') : '—') + '</td>' +
        '<td>' + esc(fmtFinish(r.verstappen_finish)) + '</td>' +
        '</tr>';
    });
    html += '</tbody></table>';
    el.innerHTML = html;
  }

  function renderStandings(standings) {
    var driversEl = document.getElementById('f1-standings-drivers');
    var constructorsEl = document.getElementById('f1-standings-constructors');
    var drivers = (standings && standings.drivers) || [];
    var constructors = (standings && standings.constructors) || [];
    if (drivers.length === 0 && constructors.length === 0) {
      driversEl.innerHTML = '<div class="empty-msg">Standings not available yet.</div>';
      constructorsEl.innerHTML = '<div class="empty-msg">Standings not available yet.</div>';
      return;
    }
    var driversHtml = '<div class="standings-card"><table><thead><tr><th>#</th><th>Driver</th><th>Team</th><th>Pts</th></tr></thead><tbody>';
    drivers.forEach(function (d) {
      driversHtml += '<tr class="' + (d.is_red_bull ? 'favorite' : '') + '">' +
        '<td>' + d.position + '</td>' +
        '<td>' + esc(d.driver) + (d.is_red_bull ? '<span class="badge">RB</span>' : '') + '</td>' +
        '<td>' + esc(d.constructor) + '</td>' +
        '<td>' + d.points + '</td></tr>';
    });
    driversHtml += '</tbody></table></div>';
    driversEl.innerHTML = driversHtml;

    var constructorsHtml = '<div class="standings-card"><table><thead><tr><th>#</th><th>Team</th><th>Pts</th></tr></thead><tbody>';
    constructors.forEach(function (c) {
      constructorsHtml += '<tr class="' + (c.is_red_bull ? 'favorite' : '') + '">' +
        '<td>' + c.position + '</td>' +
        '<td>' + esc(c.constructor) + (c.is_red_bull ? '<span class="badge">RB</span>' : '') + '</td>' +
        '<td>' + c.points + '</td></tr>';
    });
    constructorsHtml += '</tbody></table></div>';
    constructorsEl.innerHTML = constructorsHtml;
  }

  function renderUpdatedLine(schedule) {
    document.getElementById('updated-line').textContent = (schedule && schedule.last_updated)
      ? 'Data last updated: ' + fmtDateTime(schedule.last_updated)
      : 'Data not fetched yet — the nightly job will populate this soon.';
  }

  function loadJson(path) {
    return fetch(path).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    });
  }

  Promise.all([
    loadJson('./data/schedule.json').catch(function () { return null; }),
    loadJson('./data/standings.json').catch(function () { return null; })
  ]).then(function (results) {
    var schedule = results[0], standings = results[1];

    renderUpdatedLine(schedule);
    renderHero(schedule);

    if (schedule) { renderUpcoming(schedule); renderPast(schedule); }
    else document.getElementById('f1-upcoming').innerHTML = '<div class="error-msg">Couldn\'t load schedule. Try refreshing.</div>';

    if (standings) renderStandings(standings);
    else {
      var errMsg = '<div class="error-msg">Couldn\'t load standings. Try refreshing.</div>';
      document.getElementById('f1-standings-drivers').innerHTML = errMsg;
      document.getElementById('f1-standings-constructors').innerHTML = errMsg;
    }
  });

  document.querySelectorAll('.tab-bar').forEach(function (bar) {
    bar.querySelectorAll('.tab-btn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        bar.querySelectorAll('.tab-btn').forEach(function (b) { b.classList.remove('active'); });
        btn.classList.add('active');
        var panelBody = bar.nextElementSibling;
        panelBody.querySelectorAll('.tab-panel').forEach(function (panel) {
          panel.classList.toggle('hidden', panel.id !== 'f1-standings-' + btn.dataset.tab);
        });
      });
    });
  });
})();
</script>
</body>
</html>
