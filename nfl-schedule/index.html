<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NFL Schedule</title>
<style>
  :root {
    --bg: #0d0f14;
    --surface: #161921;
    --border: #232733;
    --accent: #6ee7b7;
    --accent2: #60a5fa;
    --text: #e8eaf0;
    --muted: #6b7280;
    --eagles: #004C54;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, sans-serif;
    padding: 24px 20px 48px;
  }

  .wrap { max-width: 1600px; margin: 0 auto; }

  header { margin-bottom: 20px; }

  .back { display: inline-block; font-size: 12px; color: var(--muted); text-decoration: none; margin-bottom: 10px; }
  .back:hover { color: var(--accent); }

  h1 {
    font-size: 24px;
    font-weight: 700;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 6px;
  }

  .subtitle { color: var(--muted); font-size: 13px; }
  .updated { color: var(--muted); font-size: 11px; margin-top: 6px; }

  h2.sec-title {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--muted);
    padding-bottom: 8px;
    margin-bottom: 10px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: baseline;
    justify-content: space-between;
  }

  h3.sub-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    margin: 14px 0 8px;
  }
  h3.sub-title:first-child { margin-top: 0; }

  /* Hero */
  .hero-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 20px; }
  .hero-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
  }
  .hero-label { font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
  .hero-main { font-size: 15px; font-weight: 600; margin-bottom: 4px; line-height: 1.4; }
  .hero-sub { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
  .hero-countdown { font-size: 13px; font-weight: 700; color: var(--accent); }
  .hero-empty { font-size: 13px; color: var(--muted); }

  /* Dashboard: horizontal columns on desktop, stacked on mobile */
  .dashboard { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; align-items: start; }
  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 16px;
    min-width: 0;
  }
  .panel-body { max-height: 68vh; overflow-y: auto; padding-right: 2px; }
  .panel-body .standings-grid { grid-template-columns: 1fr; }

  .count-tag { font-weight: 400; color: var(--muted); text-transform: none; letter-spacing: 0; }

  /* Cards / rows */
  .list { display: flex; flex-direction: column; gap: 8px; }
  .week-label { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin: 14px 0 6px; }
  .week-label:first-child { margin-top: 0; }

  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 13px;
  }
  .row.favorite { border-color: var(--eagles); background: linear-gradient(90deg, rgba(0,76,84,0.35), var(--bg) 60%); }

  .row .matchup { font-weight: 600; }
  .row .meta { color: var(--muted); font-size: 11px; }
  .badge {
    display: inline-block;
    font-size: 9px;
    font-weight: 700;
    padding: 2px 6px;
    border-radius: 99px;
    margin-left: 6px;
    vertical-align: middle;
    background: var(--eagles);
    color: #fff;
  }

  /* Standings tables */
  table { width: 100%; border-collapse: collapse; font-size: 12px; margin-bottom: 4px; }
  th { text-align: left; color: var(--muted); font-weight: 600; font-size: 10px; text-transform: uppercase; letter-spacing: .05em; padding: 6px 8px; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--surface); }
  td { padding: 7px 8px; border-bottom: 1px solid var(--border); }
  tr:last-child td { border-bottom: none; }
  tr.favorite td:first-child { border-left: 3px solid var(--eagles); }
  .standings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 12px; }
  .standings-card { background: var(--bg); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; overflow-x: auto; }

  .error-msg, .empty-msg { color: var(--muted); font-size: 12px; padding: 14px; text-align: center; }

  footer { margin-top: 24px; font-size: 11px; color: var(--muted); text-align: center; }
  footer a { color: var(--muted); }

  @media (max-width: 1100px) {
    .dashboard { grid-template-columns: 1fr 1fr; }
    .panel.past { grid-column: 1 / -1; }
  }

  @media (max-width: 700px) {
    .hero-grid { grid-template-columns: 1fr; }
    .dashboard { grid-template-columns: 1fr; }
    .panel.past { grid-column: auto; }
    .panel-body { max-height: none; overflow: visible; }
    th { position: static; }
  }
</style>
</head>
<body>
<div class="wrap">

<header>
  <a class="back" href="../">← Pages</a>
  <h1>🏈 NFL Schedule</h1>
  <p class="subtitle">Season schedule &amp; standings · Philadelphia Eagles highlighted</p>
  <p class="updated" id="updated-line"></p>
</header>

<div class="hero-grid" id="hero-grid"></div>

<div class="dashboard">
  <section class="panel">
    <h2 class="sec-title">Upcoming Schedule</h2>
    <div class="panel-body list" id="nfl-upcoming"></div>
  </section>

  <section class="panel">
    <h2 class="sec-title">Standings</h2>
    <div class="panel-body" id="nfl-standings"></div>
  </section>

  <section class="panel past">
    <h2 class="sec-title">Past Games <span class="count-tag" id="nfl-past-count"></span></h2>
    <div class="panel-body" id="nfl-past-list"></div>
  </section>
</div>

<footer>
  Data refreshes nightly via GitHub Actions ·
  <a href="./data/schedule.json">schedule.json</a> ·
  <a href="./data/standings.json">standings.json</a> ·
  <a href="../f1-schedule/">F1 schedule →</a>
</footer>

</div>

<script>
(function () {
  'use strict';

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function fmtDateTime(iso) {
    var d = new Date(iso);
    if (isNaN(d)) return '';
    return d.toLocaleString(undefined, { weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
  }

  function fmtDateOnly(iso) {
    var d = new Date(iso);
    if (isNaN(d)) return '';
    return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
  }

  function timeUntil(iso) {
    var now = new Date();
    var target = new Date(iso);
    var diff = target - now;
    if (diff <= 0) return 'Underway / starting now';
    var mins = Math.floor(diff / 60000);
    var hours = Math.floor(mins / 60);
    var days = Math.floor(hours / 24);
    hours = hours % 24;
    mins = mins % 60;
    if (days > 0) return 'in ' + days + 'd ' + hours + 'h';
    if (hours > 0) return 'in ' + hours + 'h ' + mins + 'm';
    return 'in ' + mins + 'm';
  }

  // Splits items into upcoming/past based on the CURRENT time at call time,
  // never a pre-computed "status" field, so re-opening the page later
  // always re-buckets against the real current date.
  function bucket(items, dateField) {
    var now = new Date();
    var upcoming = items.filter(function (i) { return i[dateField] && new Date(i[dateField]) >= now; })
      .sort(function (a, b) { return new Date(a[dateField]) - new Date(b[dateField]); });
    var past = items.filter(function (i) { return i[dateField] && new Date(i[dateField]) < now; })
      .sort(function (a, b) { return new Date(b[dateField]) - new Date(a[dateField]); });
    return { upcoming: upcoming, past: past };
  }

  function heroCard(label, main, sub, dateIso) {
    if (!main) {
      return '<div class="hero-card"><div class="hero-label">' + esc(label) + '</div><div class="hero-empty">Nothing scheduled yet — check back once data has been fetched.</div></div>';
    }
    return '<div class="hero-card">' +
      '<div class="hero-label">' + esc(label) + '</div>' +
      '<div class="hero-main">' + main + '</div>' +
      '<div class="hero-sub">' + esc(sub) + '</div>' +
      '<div class="hero-countdown">' + esc(timeUntil(dateIso)) + '</div>' +
      '</div>';
  }

  function renderHero(schedule) {
    var el = document.getElementById('hero-grid');
    var games = (schedule && schedule.games) || [];

    var nextGame = bucket(games, 'date_utc').upcoming[0];
    var nextEagles = bucket(games.filter(function (g) { return g.is_favorite; }), 'date_utc').upcoming[0];

    var html = '';
    html += nextGame
      ? heroCard('Next Game', esc(nextGame.away_team) + ' @ ' + esc(nextGame.home_team), 'Week ' + nextGame.week + ' · ' + fmtDateTime(nextGame.date_utc), nextGame.date_utc)
      : heroCard('Next Game', null);
    html += nextEagles
      ? heroCard('Next Eagles Game', esc(nextEagles.away_team) + ' @ ' + esc(nextEagles.home_team), 'Week ' + nextEagles.week + ' · ' + fmtDateTime(nextEagles.date_utc), nextEagles.date_utc)
      : heroCard('Next Eagles Game', null);

    el.innerHTML = html;
  }

  function renderUpcoming(schedule) {
    var el = document.getElementById('nfl-upcoming');
    var games = (schedule && schedule.games) || [];
    var upcoming = bucket(games, 'date_utc').upcoming;
    if (upcoming.length === 0) {
      el.innerHTML = '<div class="empty-msg">No upcoming games in the data yet.</div>';
      return;
    }
    var lastWeek = null;
    var html = '';
    upcoming.forEach(function (g) {
      var weekKey = g.season_type + '-' + g.week;
      if (weekKey !== lastWeek) {
        html += '<div class="week-label">' + esc(g.season_type) + ' · week ' + g.week + '</div>';
        lastWeek = weekKey;
      }
      html += '<div class="row' + (g.is_favorite ? ' favorite' : '') + '">' +
        '<div><span class="matchup">' + esc(g.away_team) + ' @ ' + esc(g.home_team) + '</span>' +
        (g.is_favorite ? '<span class="badge">EAGLES</span>' : '') + '</div>' +
        '<div class="meta">' + fmtDateTime(g.date_utc) + '</div>' +
        '</div>';
    });
    el.innerHTML = html;
  }

  function renderPast(schedule) {
    var count = document.getElementById('nfl-past-count');
    var el = document.getElementById('nfl-past-list');
    var games = (schedule && schedule.games) || [];
    var past = bucket(games, 'date_utc').past;
    count.textContent = '(' + past.length + ')';
    if (past.length === 0) {
      el.innerHTML = '<div class="empty-msg">No past games yet.</div>';
      return;
    }
    var html = '<table><thead><tr><th>Date</th><th>Matchup</th><th>Score</th></tr></thead><tbody>';
    past.forEach(function (g) {
      var score = (g.home_score != null && g.away_score != null) ? (g.away_score + ' - ' + g.home_score) : '—';
      html += '<tr class="' + (g.is_favorite ? 'favorite' : '') + '">' +
        '<td>' + fmtDateOnly(g.date_utc) + '</td>' +
        '<td>' + esc(g.away_team) + ' @ ' + esc(g.home_team) + (g.is_favorite ? '<span class="badge">EAGLES</span>' : '') + '</td>' +
        '<td>' + score + '</td>' +
        '</tr>';
    });
    html += '</tbody></table>';
    el.innerHTML = html;
  }

  function renderStandings(standings) {
    var el = document.getElementById('nfl-standings');
    var conferences = (standings && standings.conferences) || [];
    if (conferences.length === 0) {
      el.innerHTML = '<div class="empty-msg">Standings not available yet.</div>';
      return;
    }
    var html = '';
    conferences.forEach(function (conf) {
      html += '<h3 class="sub-title">' + esc(conf.name) + '</h3><div class="standings-grid">';
      (conf.divisions || []).forEach(function (div) {
        html += '<div class="standings-card"><h3 class="sub-title" style="margin-top:0">' + esc(div.name) + '</h3>' +
          '<table><thead><tr><th>Team</th><th>W</th><th>L</th><th>T</th><th>Pct</th></tr></thead><tbody>';
        (div.teams || []).forEach(function (t) {
          html += '<tr class="' + (t.is_eagles ? 'favorite' : '') + '">' +
            '<td>' + esc(t.team) + (t.is_eagles ? '<span class="badge">EAGLES</span>' : '') + '</td>' +
            '<td>' + t.wins + '</td><td>' + t.losses + '</td><td>' + t.ties + '</td><td>' + (t.win_pct != null ? t.win_pct.toFixed(3) : '—') + '</td>' +
            '</tr>';
        });
        html += '</tbody></table></div>';
      });
      html += '</div>';
    });
    el.innerHTML = html;
  }

  function renderUpdatedLine(schedule) {
    document.getElementById('updated-line').textContent = (schedule && schedule.last_updated)
      ? 'Data last updated: ' + fmtDateTime(schedule.last_updated)
      : 'Data not fetched yet — the nightly job will populate this soon.';
  }

  function loadJson(path) {
    return fetch(path).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    });
  }

  Promise.all([
    loadJson('./data/schedule.json').catch(function () { return null; }),
    loadJson('./data/standings.json').catch(function () { return null; })
  ]).then(function (results) {
    var schedule = results[0], standings = results[1];

    renderUpdatedLine(schedule);
    renderHero(schedule);

    if (schedule) { renderUpcoming(schedule); renderPast(schedule); }
    else document.getElementById('nfl-upcoming').innerHTML = '<div class="error-msg">Couldn\'t load schedule. Try refreshing.</div>';

    if (standings) renderStandings(standings);
    else document.getElementById('nfl-standings').innerHTML = '<div class="error-msg">Couldn\'t load standings. Try refreshing.</div>';
  });
})();
</script>
</body>
</html>
