name: Update Sports Data

on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: update-sports-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      # v4/v5 of these actions are Node 20, which runners now warn on.
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Fetch NFL data
        run: python3 .github/scripts/fetch_nfl.py
        continue-on-error: true

      - name: Fetch F1 data
        id: fetch_f1
        run: python3 .github/scripts/fetch_f1.py
        continue-on-error: true

      - name: Send race/match reminders
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          REMINDER_EMAIL_TO: ferico55@gmail.com
        run: python3 .github/scripts/send_reminders.py
        continue-on-error: true

      - name: Commit and push if changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add nfl-schedule/data/*.json f1-schedule/data/*.json .github/scripts/state/reminders_sent.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No data changes, skipping commit."
            exit 0
          fi
          git commit -m "chore: update NFL/F1 schedule and standings data"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Trigger Pages redeploy
        # A push made with the default GITHUB_TOKEN does not trigger other
        # workflows' `on: push` events (GitHub's anti-recursion safeguard),
        # so deploy.yml won't fire on its own after the commit above — kick
        # it off explicitly instead.
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main

      # continue-on-error above lets NFL data and reminders still commit when
      # Jolpica fails. This step is what turns the run red. No extra API calls.
      - name: Flag F1 fetch failure
        if: always() && steps.fetch_f1.outcome == 'failure'
        run: |
          echo "::warning title=F1 data fetch failed::Jolpica fetch failed. Existing F1 data was left unchanged; the next scheduled run will fill the gap."
          exit 1
