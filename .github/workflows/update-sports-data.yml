name: Update Sports Data

on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: update-sports-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch NFL data
        run: python3 .github/scripts/fetch_nfl.py
        continue-on-error: true

      - name: Fetch F1 data
        run: python3 .github/scripts/fetch_f1.py
        continue-on-error: true

      - name: Commit and push if changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add nfl-schedule/data/*.json f1-schedule/data/*.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No data changes, skipping commit."
            exit 0
          fi
          git commit -m "chore: update NFL/F1 schedule and standings data"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Trigger Pages redeploy
        # A push made with the default GITHUB_TOKEN does not trigger other
        # workflows' `on: push` events (GitHub's anti-recursion safeguard),
        # so deploy.yml won't fire on its own after the commit above — kick
        # it off explicitly instead.
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
